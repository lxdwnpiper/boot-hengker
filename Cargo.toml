[package]
edition = "2024"
name = "bootvine"
version = "0.1.0"

[lints.clippy]
absolute_paths = "warn"
pedantic = { priority = -1, level = "warn" }
needless_for_each = "allow"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
dbus = "0.9"
jiff = { version = "0.2", default-features = false, features = ["std"] }
ratatui = { version = "0.30", features = ["serde"] }
rustix = { version = "1", features = ["fs", "process", "stdio", "system", "termios", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
signal-hook = "0.4"
toml = "1.1.8"
unicode-truncate = "2.0"
unicode-width = "0.2"

[profile.release]
lto = "thin"
strip = true
