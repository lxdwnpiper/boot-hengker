[package]
edition = "2024"
name = "bootvine"
version = "0.1.0"
license = "GPL-3.0-or-later"
repository = "https://codeberg.org/wvhulle/bootvine"

[lints.clippy]
absolute_paths = "warn"
pedantic = { priority = -1, level = "warn" }
needless_for_each = "allow"
missing_errors_doc = "allow"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
dbus = "0.9.12"
jiff = { version = "0.2.38", default-features = false, features = ["serde", "std"] }
ratatui = { version = "0.30.2", features = ["serde", "unstable-rendered-line-info"] }
rustix = { version = "1.1.5", features = ["event", "fs", "process", "stdio", "system", "termios", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
signal-hook = "0.4.5"
toml = "1.1.8"
unicode-truncate = "2.0.1"
unicode-width = "0.2.2"
zeroize = "1.9.1"

[profile.release]
lto = "thin"
strip = true
