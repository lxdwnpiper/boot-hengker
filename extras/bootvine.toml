# piperCs hacker boot — green phosphor, intro splash, hold for Enter

[look]
operator = "piperCs"
intro = true
intro-for = "5s"

[colors.header]
origin = "light-green"
separators = "dark-gray"
total-time = "green"

[colors.stages]
branches = "dark-gray"
finished-label = "gray"
finished-time = "green"
unit-count = "gray"
failed-count = "light-red"
current = "light-green"

[colors.tree]
branches = "dark-gray"
columns = "dark-gray"
target = "light-green"
current-stage = "green"
reached-stage = "green"
running-unit = "light-green"
running-marker = "light-green"
waiting-unit = "dark-gray"
finished-unit = "dark-gray"
finished-marker = "green"
failed-unit = "light-red"
overflow = "dark-gray"

[colors.timeline]
rule = "dark-gray"
title = "green"
axis = "dark-gray"
milestone = "green"
finished = "green"
finished-label = "dark-gray"
failed = "light-red"
queued-bar = "dark-gray"
running = "light-green"
running-label = "light-green"

[colors.failures]
rule = "dark-gray"
title = "light-red"
unit = "light-red"
reason = "white"
log = "gray"
overflow = "dark-gray"

[colors.footer]
rule = "dark-gray"
done = "green"
running = "light-green"
waiting = "dark-gray"
failed = "light-red"
no-failures = "gray"

[colors.password]
frame = "green"
message = "white"
hint = "dark-gray"
checking = "gray"
rejected = "light-red"
backdrop = "dark-gray"

[timing]
hold-until-key = true
