[workspace]
release_always = true
semver_check = false
git_release_type = "prod"
pr_labels = ["release"]
pr_body = """
{% for release in releases %}
## `{{ release.package }}` {% if release.previous_version and release.previous_version != release.next_version %}{{ release.previous_version }} → {% endif %}{{ release.next_version }}

Merging this pull request into `main` will:

- tag the release commit as `v{{ release.next_version }}`
- create the Codeberg release `v{{ release.next_version }}` with the changelog below
- publish `{{ release.package }}` {{ release.next_version }} to crates.io

{% if release.changelog %}{{ release.changelog }}{% endif %}
{% endfor %}
"""

[[package]]
name = "bootvine"
changelog_path = "CHANGELOG.md"
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"

[changelog]
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
protect_breaking_commits = true
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^doc", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^style", group = "Changed" },
  { message = "^test", group = "Testing" },
  { message = "^chore: release", skip = true },
  { message = "^chore", group = "Miscellaneous" },
  { message = "^ci", group = "CI" },
  { message = "^build", group = "Build" },
  { message = "^[Mm]erge", skip = true },
  { message = ".*", group = "Other" },
]
